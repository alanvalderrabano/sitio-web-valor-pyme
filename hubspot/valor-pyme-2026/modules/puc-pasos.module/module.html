{% require_css %}<link rel="stylesheet" href="{{ get_asset_url('../../assets/css/pymeuc.css') }}">{% end_require_css %}
{% require_js %}<script src="{{ get_asset_url('../../assets/js/pymeuc.js') }}" defer></script>{% end_require_js %}

{# MÓDULO · Pyme UC · Tres pasos #}
<section class="puc-s puc-sec{% if module.fondo == 'suave' %} puc-sec--soft{% endif %}" id="{{ module.seccion_id }}">
  <div class="puc-wrap">
    <header class="puc-sec__head"><h2>{{ module.titulo }}</h2></header>
    <ol class="puc-pasos">
      {% for p in module.pasos %}
      <li>
        <span class="puc-paso__n">{{ loop.index }}</span>
        <h3>{{ p.paso_titulo }}</h3>
        <p>{{ p.paso_texto }}</p>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
